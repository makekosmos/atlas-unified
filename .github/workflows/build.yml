name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 21 * * *' # 00:00 Moscow (UTC+3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha || steps.source.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release branch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test version rules
        run: |
          python scripts/test_release.py
          python scripts/test_release_notes.py
      - name: Plan release
        id: plan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py plan

  build:
    needs: prepare
    if: needs.prepare.outputs.release != 'false'
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          # SDK 26+ enables Tahoe's native window controls, matching Cortex.
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply release version
        if: needs.prepare.outputs.release == 'true'
        run: python scripts/release.py set "$RELEASE_VERSION"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$BUILD_TARGET"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - name: macOS SDK and Metal compiler
        if: runner.os == 'macOS'
        run: |
          macos_sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          if [ "${macos_sdk_version%%.*}" -lt 26 ]; then
            echo "Atlas requires macOS SDK 26+ for native Tahoe window controls (found $macos_sdk_version)" >&2
            exit 1
          fi
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        timeout-minutes: 40
        run: cargo test --locked --release --workspace --all-features --target "$BUILD_TARGET" --timings
      - name: Source size
        if: runner.os == 'Windows'
        run: cargo run --locked --release --bin check-source-size --target "$BUILD_TARGET"
      - name: Release build
        run: |
          started=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          start_seconds=$(date +%s)
          cargo build --locked --release --bin atlas --target "$BUILD_TARGET" --timings
          end_seconds=$(date +%s)
          echo "Atlas build: $started to $(date -u '+%Y-%m-%dT%H:%M:%SZ') ($((end_seconds - start_seconds)) seconds; rust-cache hit: ${{ steps.rust-cache.outputs.cache-hit || 'unknown' }})." | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh "target/$BUILD_TARGET/release" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsi = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsi\makensis.exe")) { $nsi = "$env:ProgramFiles\NSIS" }
          Add-Content $env:GITHUB_PATH $nsi
      - name: Package
        run: |
          start_seconds=$(date +%s)
          python scripts/release.py package "$BUILD_TARGET"
          echo "Packaging: $(( $(date +%s) - start_seconds )) seconds." | tee -a "$GITHUB_STEP_SUMMARY"
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.exe
            target/cargo-timings
          if-no-files-found: error
          retention-days: 7

  android:
    needs: prepare
    if: needs.prepare.outputs.release != 'false'
    name: Build (Android ARM64)
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
          rustup default 1.99.1
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        id: android-rust-cache
        with:
          key: android-arm64
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install matching NSH 0.3.0 Android SDK and CLI
        run: |
          mkdir -p "$RUNNER_TEMP/nsh"
          curl -fsSL https://github.com/longbridge/nsh/releases/download/v0.3.0/nsh-embed-android.zip -o "$RUNNER_TEMP/nsh-embed-android.zip"
          echo 'adc5c71e547c9901462208b50630548b3ae618b53555c581937a1d5c4e05eda6  nsh-embed-android.zip' > "$RUNNER_TEMP/nsh-embed-android.zip.sha256"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c nsh-embed-android.zip.sha256)
          unzip -q "$RUNNER_TEMP/nsh-embed-android.zip" -d "$RUNNER_TEMP"
          cargo install nsh-cli --version 0.3.0 --locked
          {
            echo "NSH_CLI=$HOME/.cargo/bin/nsh"
            echo "NSH_ANDROID_AAR=$RUNNER_TEMP/nsh-embed-android/nsh.aar"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"
          "$HOME/.cargo/bin/nsh" --version | rg '^nsh 0\.3\.0 '
      - name: Apply release version
        if: needs.prepare.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release.py set "$RELEASE_VERSION"
      - name: Restore Android signing key
        if: needs.prepare.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ATLAS_ANDROID_KEYSTORE_BASE64 repository secret.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_PATH="$RUNNER_TEMP/android-signing/atlas-release-key.p12"
          KEYSTORE_B64="$KEYSTORE_B64" KEYSTORE_PATH="$KEYSTORE_PATH" python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["KEYSTORE_PATH"]).write_bytes(base64.b64decode(os.environ["KEYSTORE_B64"], validate=True))'
          echo "ATLAS_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed Android release
        if: needs.prepare.outputs.release == 'true'
        env:
          ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ATLAS_ANDROID_KEY_PASSWORD" || { echo 'Missing ATLAS_ANDROID_KEY_PASSWORD repository secret.' >&2; exit 1; }
          started=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          start_seconds=$(date +%s)
          scripts/build-android-release.sh
          echo "Android release build: $started to $(date -u '+%Y-%m-%dT%H:%M:%SZ') ($(( $(date +%s) - start_seconds )) seconds; rust-cache hit: ${{ steps.android-rust-cache.outputs.cache-hit || 'unknown' }})." | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target/android-rust android/app/build dist/Atlas-Android-arm64.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build Android debug APK
        if: needs.prepare.outputs.release != 'true'
        run: |
          started=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          start_seconds=$(date +%s)
          ./android/gradlew --project-dir android --no-daemon --profile :app:assembleDebug
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Atlas-Android-debug-arm64.apk
          echo "Android debug build: $started to $(date -u '+%Y-%m-%dT%H:%M:%SZ') ($(( $(date +%s) - start_seconds )) seconds; rust-cache hit: ${{ steps.android-rust-cache.outputs.cache-hit || 'unknown' }})." | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target/android-rust android/app/build dist/Atlas-Android-debug-arm64.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-android-arm64
          path: |
            dist/Atlas-Android-arm64.apk
            dist/Atlas-Android-debug-arm64.apk
            android/app/build/reports/profile
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build, android]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: atlas-*
          merge-multiple: true
          path: dist
      - name: Generate task and contributor notes
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python scripts/release_notes.py --previous "$PREVIOUS_TAG" --head "$SOURCE_SHA"
      - name: Commit version and tag the tested source
        run: bash scripts/publish-version.sh
      - name: Publish all platforms together
        run: |
          tag="v$RELEASE_VERSION"
          cd dist
          sha256sum Atlas-Setup.exe Atlas.dmg Atlas-Android-arm64.apk > SHA256SUMS.txt
          cd ..
          if gh release view "$tag" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release already published"'
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --draft --title "Atlas $tag" --notes-file release-notes.md
          fi
          gh release edit "$tag" --notes-file release-notes.md --draft=false --latest
