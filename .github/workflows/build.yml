name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 21 * * *' # 00:00 Moscow (UTC+3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha || steps.source.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release branch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test version rules
        run: |
          python scripts/test_release.py
          python scripts/test_release_notes.py
      - name: Plan release
        id: plan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py plan

  build:
    needs: prepare
    if: needs.prepare.outputs.release != 'false'
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          # SDK 26+ enables Tahoe's native window controls, matching Cortex.
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply release version
        if: needs.prepare.outputs.release == 'true'
        run: python scripts/release.py set "$RELEASE_VERSION"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$BUILD_TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - name: macOS build tools for Opus
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool
      - name: macOS SDK and Metal compiler
        if: runner.os == 'macOS'
        run: |
          macos_sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          if [ "${macos_sdk_version%%.*}" -lt 26 ]; then
            echo "Atlas requires macOS SDK 26+ for native Tahoe window controls (found $macos_sdk_version)" >&2
            exit 1
          fi
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        timeout-minutes: 40
        run: cargo test --locked --release --workspace --all-features --target "$BUILD_TARGET"
      - name: Source size
        if: runner.os == 'Windows'
        run: cargo run --locked --release --bin check-source-size --target "$BUILD_TARGET"
      - name: Release build
        run: cargo build --locked --release --bin atlas --target "$BUILD_TARGET"
      - name: Package
        run: python scripts/release.py package "$BUILD_TARGET"
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # NSIS resolves relative paths against the script's own folder: give
          # it absolute ones.
          # A push carries no release version: the crate's own is the truth.
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $exe = Join-Path $PWD "target\$env:BUILD_TARGET\release\atlas.exe"
          $out = Join-Path $PWD "dist\Atlas-Setup.exe"
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            /DVERSION="$version" `
            /DEXE="$exe" `
            /DOUT="$out" `
            (Join-Path $PWD "scripts\atlas.nsi")
          if (-not (Test-Path dist\Atlas-Setup.exe)) { throw "NSIS produced no installer" }
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build (android)
    needs: prepare
    if: needs.prepare.outputs.release != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      # The phone bundle is built from nsh's own runtime: pinned, so a new nsh
      # commit cannot change the app under us.
      NSH_REV: 1894697155685ef5b8669e51406ce0f6aa710bbd
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply release version
        if: needs.prepare.outputs.release == 'true'
        run: python scripts/release.py set "$RELEASE_VERSION"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          yes | sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "build-tools;35.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: nsh runtime
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/longbridge/nsh.git /opt/nsh
          git -C /opt/nsh checkout --quiet "$NSH_REV"
          cd /opt/nsh
          cargo xtask android --release --abi arm64-v8a --abi armeabi-v7a --abi x86_64
          mkdir -p /opt/nsh-runtime/android
          ln -s /opt/nsh/target/android/release /opt/nsh-runtime/android/release
          cargo build --release -p nsh-cli --bin nsh
          echo "NSH_RUNTIME=/opt/nsh-runtime" >> "$GITHUB_ENV"
          echo "/opt/nsh/target/release" >> "$GITHUB_PATH"
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE:-}" ]; then
            echo "ATLAS_ANDROID_KEYSTORE_BASE64 is not set: the APK would be signed with a debug key and would not install over 0.0.1" >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > /opt/atlas-keystore.jks
          # The alias is whatever the keystore holds: reading it beats asking
          # for one more secret that nobody wrote down.
          alias=$(keytool -list -keystore /opt/atlas-keystore.jks -storepass "$KEY_PASSWORD" 2>/dev/null \
            | awk -F, '/PrivateKeyEntry/ {print $1; exit}')
          if [ -z "$alias" ]; then
            echo "the keystore holds no private key entry" >&2
            exit 1
          fi
          echo "ATLAS_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - name: APK
        env:
          KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build=$(python -c 'import json; print(json.load(open("ui/nsh.json"))["build"])')
          nsh package --target android ui/Mobile.tsx \
            --keystore /opt/atlas-keystore.jks \
            --key-alias "$ATLAS_KEY_ALIAS" \
            --keystore-password "$KEY_PASSWORD" \
            --app-version "$RELEASE_VERSION" \
            --build "$build" \
            -o dist
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: atlas-*
          merge-multiple: true
          path: dist
      - name: Generate task and contributor notes
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python scripts/release_notes.py --previous "$PREVIOUS_TAG" --head "$SOURCE_SHA"
      - name: Commit version and tag the tested source
        run: bash scripts/publish-version.sh
      - name: Publish all platforms together
        run: |
          tag="v$RELEASE_VERSION"
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cd ..
          if gh release view "$tag" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release already published"'
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --draft --title "Atlas $tag" --notes-file release-notes.md
          fi
          gh release edit "$tag" --notes-file release-notes.md --draft=false --latest
